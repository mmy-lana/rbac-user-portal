services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-vault-postgres
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vaultsecret
      POSTGRES_DB: vaultdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault -d vaultdb']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
